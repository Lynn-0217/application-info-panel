<!doctype html>
<html lang="zh-CN" data-surface="panel">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Application Info · 申请信息库</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="toolbar"><h1>信息库</h1><div class="toolbar-actions"><button id="pinBtn" class="icon-btn" type="button" aria-label="固定到侧栏" title="固定到侧栏，点击网页也不会关闭" disabled></button><button id="addBtn" class="primary" type="button" disabled>＋ 新增</button></div></div>
      <div id="errorBanner" class="notice error hidden" role="alert"></div>
      <div class="search-wrap"><span id="searchIcon" aria-hidden="true"></span><input id="searchInput" type="search" aria-label="搜索信息" placeholder="搜索信息" autocomplete="off" /></div>
      <div class="filter-row"><label class="sr-only" for="categoryFilter">按分类筛选</label><select id="categoryFilter"><option value="">全部分类</option></select><span id="resultCount" aria-live="polite">0 条</span></div>
    </header>

    <main id="mainContent">
      <div id="cards" class="records"></div>
      <div id="emptyState" class="empty hidden"><h2 id="emptyTitle">暂无信息</h2><p id="emptyDescription">点击「新增」保存常用信息。</p><button id="emptyAddBtn" type="button" disabled>新增信息</button><button id="clearFiltersBtn" type="button" class="subtle hidden">清除筛选</button></div>
    </main>

    <footer><span id="storageStatus">正在读取…</span><div class="backup-actions"><button id="exportBtn" type="button" disabled>导出</button><button id="importBtn" type="button" disabled>导入</button><input id="importInput" class="hidden" type="file" accept=".json,application/json" aria-label="选择 JSON 备份" /></div></footer>
  </div>

  <dialog id="editDialog" aria-labelledby="dialogTitle">
    <form id="editForm">
      <div class="dialog-head"><h2 id="dialogTitle">新增信息</h2><button id="closeDialogBtn" class="icon-btn" type="button" aria-label="关闭编辑"></button></div>
      <label for="categoryField">分类 <span class="required">*</span></label><input id="categoryField" required maxlength="100" list="categorySuggestions" placeholder="如：基本信息、教育、Publications" /><datalist id="categorySuggestions"></datalist>
      <label for="labelField">名称 <span class="required">*</span></label><input id="labelField" required maxlength="200" placeholder="如：英文姓名、论文引用、学校地址" />
      <label for="valueField">内容 <span class="required">*</span></label><textarea id="valueField" required maxlength="100000" rows="4" placeholder="要保存或复制的内容"></textarea>
      <p id="formError" class="form-error hidden" role="alert"></p>
      <div class="dialog-actions"><button id="cancelBtn" type="button">取消</button><button id="saveBtn" class="primary" type="submit">保存信息</button></div>
    </form>
  </dialog>

  <dialog id="deleteDialog" aria-labelledby="deleteTitle" aria-describedby="deleteSummary"><div class="dialog-content"><h2 id="deleteTitle">删除信息</h2><p id="deleteSummary"></p><p class="muted">删除后无法撤销。</p><p id="deleteError" class="form-error hidden" role="alert"></p><div class="dialog-actions"><button id="cancelDeleteBtn" type="button">取消</button><button id="confirmDeleteBtn" class="danger" type="button">删除</button></div></div></dialog>
  <dialog id="importDialog" aria-labelledby="importTitle"><div class="import-content"><h2 id="importTitle">导入备份</h2><p id="importSummary"></p><p class="muted">信息会合并到现有库，完全相同的内容会自动跳过。</p><p id="importError" class="form-error hidden" role="alert"></p><div class="dialog-actions"><button id="cancelImportBtn" type="button">取消</button><button id="confirmImportBtn" class="primary" type="button">合并导入</button></div></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="language.js"></script>
  <script src="i18n.js"></script>
  <script src="info-model.js"></script>
  <script src="info-store.js"></script>
  <script src="pin-panel.js"></script>
  <script src="popup.js"></script>
</body>
</html>
